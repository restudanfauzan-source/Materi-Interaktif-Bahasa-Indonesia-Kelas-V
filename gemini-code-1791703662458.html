<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Menekuni Hobi - RPG Edukasi Kelas V</title>
    <!-- Import Google Fonts yang Ceria & Estetik (Fredoka & Sniglet) -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Sniglet:wght@400;800&family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cozy-green-dark: #2b4533;
            --cozy-green-main: #3a5a40;
            --cozy-green-light: #588157;
            --cozy-pill-green: #a3b18a;
            --cozy-cream: #fffbe6;
            --cozy-border: #dad7cd;
            --cozy-text: #2f3e46;
            --cozy-accent: #e9c46a;
            --cozy-orange: #f4a261;
            --success: #2a9d8f;
            --danger: #e76f51;
            --radius-cozy: 26px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            /* Latar belakang bertema hobi seni, melukis, dan kreativitas anak SD */
            background: linear-gradient(135deg, rgba(43, 69, 51, 0.75), rgba(58, 90, 64, 0.75)), 
                        url('https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
            color: var(--cozy-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 1150px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 0 0 6px rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            min-height: 720px;
            max-height: 96vh;
            overflow: hidden;
            position: relative;
            border: 4px solid var(--cozy-green-dark);
            animation: appEntrance 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes appEntrance {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Screen Shake Effect untuk Jawaban Salah */
        .shake-effect {
            animation: shakeScreen 0.4s cubic-bezier(.36,.07,.19,.95) both;
        }

        @keyframes shakeScreen {
            0%, 100% { transform: translate3d(0, 0, 0); }
            20%, 60% { transform: translate3d(-10px, 0, 0); }
            40%, 80% { transform: translate3d(10px, 0, 0); }
        }

        /* Top HUD Bar */
        .game-hud {
            background: linear-gradient(180deg, #2b4533 0%, #3a5a40 100%);
            color: white;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--cozy-accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 30;
        }

        .hud-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Sniglet', cursive;
            font-size: 1.35rem;
            color: #feefdd;
        }

        .hud-stats {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .hud-badge {
            background: rgba(255, 251, 230, 0.95);
            padding: 6px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 700;
            border: 3px dashed var(--cozy-pill-green);
            color: var(--cozy-green-dark);
        }

        .btn-ui {
            background: #feefdd;
            color: var(--cozy-green-dark);
            border: 3px solid var(--cozy-pill-green);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--cozy-green-dark);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }

        .btn-ui:hover { transform: translateY(-2px); background: #ffffff; }
        .btn-ui:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--cozy-green-dark); }
        .btn-bgm-on { background: var(--cozy-accent); border-color: #d4a373; color: #582f0e; }

        /* View Content Container */
        .view-content {
            flex: 1;
            padding: 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: radial-gradient(circle at top, #fefae0 0%, #f4f1de 100%);
        }

        /* Home Screen Bertema Hobi & Kreativitas Anak SD */
        .home-screen {
            text-align: left;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding: 50px 60px;
            flex: 1;
            background: linear-gradient(90deg, rgba(43, 69, 51, 0.85) 0%, rgba(0,0,0,0.3) 100%), 
                        url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
            border-radius: 28px;
            border: 4px solid var(--cozy-green-dark);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.3);
        }

        .home-logo-box {
            margin-bottom: 25px;
            animation: floatLogo 3s ease-in-out infinite alternate;
        }

        @keyframes floatLogo {
            0% { transform: translateY(0) rotate(-1deg); }
            100% { transform: translateY(-8px) rotate(1deg); }
        }

        .home-logo-box h1 {
            font-family: 'Sniglet', cursive;
            font-size: 3.8rem;
            color: #ffffff;
            text-shadow: 4px 4px 0px var(--cozy-green-dark), 0 8px 20px rgba(0,0,0,0.5);
            line-height: 1.1;
        }

        .home-logo-box span {
            font-size: 1.25rem;
            color: #fefae0;
            background: var(--cozy-green-main);
            padding: 6px 18px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            border: 2px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Kartu Kertas Jahitan (Stitching Card) */
        .cozy-menu-card {
            background: var(--cozy-cream);
            border: 3px dashed var(--cozy-pill-green);
            border-radius: 28px;
            padding: 28px 36px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25), inset 0 0 0 8px rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 360px;
        }

        .cozy-menu-card h2 {
            font-family: 'Sniglet', cursive;
            color: var(--cozy-green-dark);
            font-size: 1.7rem;
            text-align: center;
            margin-bottom: 4px;
        }

        /* Tombol Pill Kapsul Warna Hijau Sage Pastel */
        .btn-pill-play {
            background: linear-gradient(180deg, #a3b18a 0%, #7d8f63 100%);
            color: #ffffff;
            border: 3px solid #ffffff;
            padding: 16px 30px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--cozy-green-dark), 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.15s ease;
            text-align: center;
            width: 100%;
        }

        .btn-pill-play:hover {
            background: linear-gradient(180deg, #b5c49c 0%, #8d9e72 100%);
            transform: translateY(-3px);
            box-shadow: 0 9px 0 var(--cozy-green-dark), 0 12px 22px rgba(0,0,0,0.25);
        }

        .btn-pill-play:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--cozy-green-dark);
        }

        /* World Map Grid */
        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--cozy-green-dark);
            padding: 20px 28px;
            border-radius: 24px;
            border: 3px solid var(--cozy-accent);
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .map-header h2 {
            font-family: 'Sniglet', cursive;
            font-size: 1.7rem;
            color: #feefdd;
        }

        .world-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 20px;
            margin-top: 5px;
        }

        .world-node {
            background: #ffffff;
            border: 3px dashed var(--cozy-pill-green);
            border-radius: 24px;
            padding: 22px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            position: relative;
        }

        .world-node:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--cozy-green-main);
            box-shadow: 0 15px 30px rgba(58, 90, 64, 0.2);
            background: var(--cozy-cream);
        }

        .node-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .node-badge-level {
            font-size: 0.8rem;
            font-weight: 700;
            background: #e9edc9;
            color: var(--cozy-green-dark);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .world-node h3 {
            color: var(--cozy-green-dark);
            font-size: 1.25rem;
            font-weight: 800;
        }

        .world-node p {
            font-size: 0.95rem;
            color: var(--cozy-text);
            line-height: 1.5;
            font-weight: 600;
        }

        .node-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            padding-top: 10px;
            border-top: 2px dashed #e9edc9;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* Character Dialog Box dengan Ilustrasi Siswa SD/Mentor */
        .npc-dialog-box {
            background: #ffffff;
            border: 3px dashed var(--cozy-pill-green);
            border-radius: 24px;
            padding: 16px 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
        }

        .npc-avatar {
            font-size: 2.8rem;
            background: #f4f1de;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 3px solid var(--cozy-pill-green);
            flex-shrink: 0;
        }

        .npc-text h4 {
            color: var(--cozy-green-dark);
            font-size: 1.1rem;
            font-weight: 800;
        }

        .npc-text p {
            color: var(--cozy-text);
            font-size: 0.98rem;
            line-height: 1.5;
            font-weight: 600;
        }

        /* Quest Screen */
        .quest-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 16px 24px;
            border-radius: 20px;
            border: 3px solid var(--cozy-border);
        }

        .stepper-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .step-dot {
            padding: 8px 16px;
            background: #e9edc9;
            color: var(--cozy-green-dark);
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .step-dot.active {
            background: var(--cozy-green-main);
            color: white;
            box-shadow: 0 4px 10px rgba(58, 90, 64, 0.3);
        }

        .quest-card {
            background: #ffffff;
            border: 3px dashed var(--cozy-pill-green);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .quest-card h3 {
            color: var(--cozy-green-dark);
            font-size: 1.5rem;
            font-weight: 800;
        }

        .quest-card p, .quest-card li {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--cozy-text);
            font-weight: 600;
        }

        .highlight-box {
            background: var(--cozy-cream);
            border: 3px dashed var(--cozy-accent);
            padding: 22px;
            border-radius: 20px;
        }

        .highlight-box h4 {
            color: #b45309;
            margin-bottom: 8px;
            font-size: 1.15rem;
            font-weight: 800;
        }

        /* Game Arena */
        .game-arena {
            background: var(--cozy-cream);
            border: 3px solid var(--cozy-pill-green);
            border-radius: 24px;
            padding: 26px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .question-box {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--cozy-green-dark);
            margin-bottom: 20px;
            background: #ffffff;
            padding: 20px;
            border-radius: 18px;
            border: 3px dashed var(--cozy-pill-green);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-game-btn {
            background: #ffffff;
            border: 3px solid var(--cozy-border);
            padding: 16px 22px;
            border-radius: 50px;
            text-align: left;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 var(--cozy-border);
            color: var(--cozy-text);
        }

        .option-game-btn:hover:not(:disabled) {
            border-color: var(--cozy-pill-green);
            background: #e9edc9;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--cozy-pill-green);
        }

        .option-game-btn.correct {
            background: #ccd5ae !important;
            border-color: #52b788 !important;
            color: #2d6a4f !important;
            box-shadow: 0 4px 0 #52b788 !important;
        }

        .option-game-btn.incorrect {
            background: #ffddd2 !important;
            border-color: #e07a5f !important;
            color: #78290f !important;
            box-shadow: 0 4px 0 #e07a5f !important;
        }

        .feedback-banner {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 1.05rem;
            text-align: center;
        }

        .feedback-success { background: #e8f5e9; color: #2e7d32; border: 3px dashed #81c784; }
        .feedback-error { background: #ffebee; color: #c62828; border: 3px dashed #ef9a9a; }

        .sortable-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .sortable-item {
            background: #ffffff;
            border: 3px dashed var(--cozy-accent);
            padding: 16px 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .sort-btn-group { display: flex; gap: 8px; }

        .sort-action-btn {
            background: var(--cozy-pill-green);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 3px 0 var(--cozy-green-dark);
        }

        .action-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px dashed var(--cozy-border);
        }

        .btn-secondary {
            background: #e9edc9;
            color: var(--cozy-green-dark);
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #ccd5ae;
        }

        .btn-primary {
            background: linear-gradient(180deg, #a3b18a 0%, #7d8f63 100%);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--cozy-green-dark);
        }

        @media(max-width: 768px) {
            .home-screen { padding: 30px 20px; }
            .home-logo-box h1 { font-size: 2.6rem; }
            .cozy-menu-card { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- ELEMEN AUDIO BGM & EFEK SUARA MENANG -->
    <audio id="bgmAudio" src="musicgame.mp3" preload="auto" loop></audio>
    <audio id="winAudio" src="menangsfx.mp3" preload="auto"></audio>

    <script>
        class SoundManager {
            constructor() {
                this.bgm = document.getElementById('bgmAudio');
                this.winSound = document.getElementById('winAudio');
                if (this.bgm) this.bgm.volume = 0.4;
                if (this.winSound) this.winSound.volume = 0.8;
                this.isBgmPlaying = false;
                this.ctx = null;
            }

            initCtx() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playClick() {
                try {
                    this.initCtx();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(550, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(750, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e) {}
            }

            playCorrect() {
                try {
                    this.initCtx();
                    const now = this.ctx.currentTime;
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + i * 0.07);
                        gain.gain.setValueAtTime(0.15, now + i * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.25);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.07);
                        osc.stop(now + i * 0.07 + 0.25);
                    });
                } catch(e) {}
            }

            playWrong() {
                try {
                    this.initCtx();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.linearRampToValueAtTime(90, now + 0.25);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } catch(e) {}
            }

            playVictory() {
                try {
                    this.initCtx();
                    const now = this.ctx.currentTime;
                    const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51, 1760];
                    notes.forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + i * 0.09);
                        gain.gain.setValueAtTime(0.18, now + i * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.4);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.09);
                        osc.stop(now + i * 0.09 + 0.4);
                    });
                } catch(e) {}
            }

            playWinFanfare() {
                try {
                    if (this.winSound) {
                        this.winSound.currentTime = 0;
                        this.winSound.play().catch(e => {
                            this.playVictory();
                        });
                    } else {
                        this.playVictory();
                    }
                } catch(e) {
                    this.playVictory();
                }
            }

            startBGMForce() {
                if (!this.bgm) return;
                this.bgm.play().then(() => {
                    this.isBgmPlaying = true;
                }).catch(e => {
                    this.isBgmPlaying = false;
                });
            }

            toggleBGM() {
                if (!this.bgm) return false;
                if (this.isBgmPlaying) {
                    this.bgm.pause();
                    this.isBgmPlaying = false;
                } else {
                    this.startBGMForce();
                }
                return this.isBgmPlaying;
            }
        }

        const sounds = new SoundManager();

        window.toggleBGMPlayer = function(btn) {
            const active = sounds.toggleBGM();
            btn.innerHTML = active ? '🔊 BGM: ON' : '🔇 BGM: OFF';
            btn.className = active ? 'btn-ui btn-bgm-on' : 'btn-ui';
            sounds.playClick();
        };

        const appData = {
            materials: [
                {
                    id: 'cerita',
                    title: 'Misi 1: Pulau Cerita Inspiratif',
                    subtitle: 'Kisah Nyata Yuda Ardhi & Potensi Hobi',
                    npcGreeting: "Halo teman-teman! Aku Budi, siswa kelas V yang suka menggambar. Mari kita bedah kisah sukses Kak Yuda Ardhi bersama-sama!",
                    explain: `
                        <p style="margin-bottom: 12px;"><strong>1. Mengenal Bentuk Teks Narasi & Kisah Inspiratif</strong><br>
                        Teks narasi adalah jenis teks yang merangkai suatu peristiwa atau kisah secara kronologis (berurutan berdasarkan waktu). Di dalam Kurikulum Merdeka Kelas V, teks narasi sering kali mengangkat kisah nyata tokoh inspiratif untuk menanamkan karakter kerja keras, ketekunan, dan kreativitas kepada peserta didik.</p>
                        
                        <p style="margin-bottom: 12px;"><strong>2. Profil Singkat Yuda Ardhi Sang Kreator</strong><br>

                                        <span style="color: ${isDone ? 'var(--cozy-green-dark)' : '#8d99ae'}">
                                            ${isDone ? '✅ Selesai' : '▶️ Mainkan'}
                                        </span>
                                        <span style="color: var(--cozy-green-main);">Buka Misi →</span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div style="background: var(--cozy-cream); border: 3px dashed var(--cozy-accent); border-radius: 24px; padding: 22px 28px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                        <div>
                            <h3 style="color: #b45309; font-size: 1.3rem; font-weight: 800;">👑 Kuis Master Petualangan</h3>
                            <p style="color: var(--cozy-text); font-size: 0.95rem; font-weight: 600; margin-top: 2px;">Uji seluruh pemahamanmu dari ke-5 misi dalam 10 soal tantangan komprehensif!</p>
                        </div>
                        <button class="btn-pill-play" onclick="sounds.playClick(); startFinalQuiz()" style="padding: 12px 28px; font-size: 1.05rem; width: auto;">
                            Mulai Kuis Master ➔
                        </button>
                    </div>
                `;
            } else if (state.currentScreen === 'material') {
                const mat = appData.materials.find(m => m.id === state.currentMaterialId);
                const steps = [
                    { id: 'explain', label: '1. Materi' },
                    { id: 'example', label: '2. Contoh' },
                    { id: 'summary', label: '3. Rangkuman' },
                    { id: 'game', label: '4. Tantangan' }
                ];

                const stepperHtml = `
                    <div class="stepper-bar">
                        ${steps.map(s => `
                            <div class="step-dot ${state.materialStep === s.id ? 'active' : ''}">
                                ${s.label}
                            </div>
                        `).join('')}
                    </div>
                `;

                // Avatar siswa SD/Mentor berganti tiap misi
                const studentAvatars = { 'cerita': '👦🎨', 'awalan': '👧✍️', 'prosedur': '👦🍳', 'surat': '👧✉️', 'kosakata': '👦📚' };
                const avatarIcon = studentAvatars[mat.id] || '👦🎒';

                const npcBox = `
                    <div class="npc-dialog-box">
                        <div class="npc-avatar">${avatarIcon}</div>
                        <div class="npc-text">
                            <h4>Catatan Teman Belajar:</h4>
                            <p>${mat.npcGreeting}</p>
                        </div>
                    </div>
                `;

                if (state.materialStep === 'explain') {
                    container.innerHTML = `
                        <div class="quest-header">
                            <h2>📚 ${mat.title}</h2>
                            <span style="font-weight: 800; color: var(--cozy-green-dark);">Misi Belajar</span>
                        </div>
                        ${stepperHtml}
                        ${npcBox}
                        <div class="quest-card">
                            <h3>📖 Penjelasan Materi Mendalam</h3>
                            <div>${mat.explain}</div>
                        </div>
                        <div class="action-footer">
                            <button class="btn-secondary" onclick="sounds.playClick(); goToMenu()">← Peta Utama</button>
                            <button class="btn-primary" onclick="sounds.playClick(); setMaterialStep('example')">Lanjut ke Contoh →</button>
                        </div>
                    `;
                } else if (state.materialStep === 'example') {
                    container.innerHTML = `
                        <div class="quest-header">
                            <h2>💡 ${mat.title}</h2>
                            <span style="font-weight: 800; color: #b45309;">Analisis Buku</span>
                        </div>
                        ${stepperHtml}
                        <div class="quest-card" style="border-color: var(--cozy-accent);">
                            <h3>🔍 Contoh Nyata & Analisis</h3>
                            <div>${mat.example}</div>
                        </div>
                        <div class="action-footer">
                            <button class="btn-secondary" onclick="sounds.playClick(); setMaterialStep('explain')">← Kembali</button>
                            <button class="btn-primary" onclick="sounds.playClick(); setMaterialStep('summary')">Lanjut ke Rangkuman →</button>
                        </div>
                    `;
                } else if (state.materialStep === 'summary') {
                    container.innerHTML = `
                        <div class="quest-header">
                            <h2>⭐ ${mat.title}</h2>
                            <span style="font-weight: 800; color: var(--cozy-green-main);">Poin Penting</span>
                        </div>
                        ${stepperHtml}
                        <div class="highlight-box">
                            <h4>✨ Yang Perlu Diingat</h4>
                            <p style="font-size: 1.15rem; font-weight: 800; color: #78350f;">${mat.summary}</p>
                        </div>
                        <div class="action-footer">
                            <button class="btn-secondary" onclick="sounds.playClick(); setMaterialStep('example')">← Kembali</button>
                            <button class="btn-primary" onclick="sounds.playVictory(); startMiniGame()" style="background: var(--cozy-green-main);">AKU PAHAM, MULAI TANTANGAN! 🎮</button>
                        </div>
                    `;
                } else if (state.materialStep === 'game') {
                    container.innerHTML = `
                        <div class="quest-header">
                            <h2>🎮 Tantangan Misi: ${mat.title.split(': ')[1]}</h2>
                            <span style="font-weight: 800; color: var(--cozy-green-main);">⭐ Bintang: ${state.stars}</span>
                        </div>
                        ${stepperHtml}
                        ${renderGameContent(mat)}
                    `;
                } else if (state.materialStep === 'result') {
                    state.completedMissions[mat.id] = true;
                    container.innerHTML = `
                        <div style="text-align: center; display: flex; flex-direction: column; gap: 18px; align-items: center; padding: 30px;">
                            <div style="font-size: 5rem;">🏆🎉</div>
                            <h2 style="color: var(--cozy-green-dark); font-size: 2rem; font-weight: 800;">Misi Berhasil Dituntaskan!</h2>
                            <p style="font-size: 1.1rem; color: var(--cozy-text); font-weight: 600;">Luar biasa! Kamu telah menguasai materi ${mat.title.split(': ')[1]} dengan sempurna.</p>
                            <div class="hud-badge" style="padding: 10px 22px; font-size: 1.1rem;">
                                ⭐ +1 Bintang Petualangan Ditambahkan!
                            </div>
                            <div style="display: flex; gap: 14px; margin-top: 10px;">
                                <button class="btn-secondary" onclick="sounds.playClick(); startMiniGame()">Ulangi Tantangan 🔄</button>
                                <button class="btn-primary" onclick="sounds.playClick(); goToMenu()">Kembali ke Peta Utama 🗺️</button>
                            </div>
                        </div>
                    `;
                }
            } else if (state.currentScreen === 'final_quiz') {
                container.innerHTML = renderFinalQuizContent();
            } else if (state.currentScreen === 'quiz_result') {
                container.innerHTML = `
                    <div style="text-align: center; display: flex; flex-direction: column; gap: 18px; align-items: center; padding: 30px;">
                        <div style="font-size: 5.5rem;">👑🎓</div>
                        <h2 style="color: var(--cozy-green-dark); font-size: 2.2rem; font-weight: 800;">HASIL KUIS MASTER PETUALANGAN</h2>
                        <p style="font-size: 1.1rem; color: var(--cozy-text); font-weight: 600;">Kerja sangat luar biasa! Seluruh 10 soal ujian master telah kamu selesaikan.</p>
                        <div style="background: var(--cozy-cream); padding: 24px; border-radius: 24px; border: 3px dashed var(--cozy-accent); width: 100%; max-width: 420px;">
                            <p style="font-size: 1.1rem; margin-bottom: 8px; font-weight: 700;">Jawaban Benar: <strong style="color: #2e7d32; font-size: 1.2rem;">${state.finalQuizScore}</strong> dari 10 soal</p>
                            <p style="font-size: 1.1rem; margin-bottom: 12px; font-weight: 700;">Jawaban Salah: <strong style="color: #c62828; font-size: 1.2rem;">${10 - state.finalQuizScore}</strong> soal</p>
                            <hr style="border: none; border-top: 2px dashed var(--cozy-accent); margin: 12px 0;">
                            <p style="font-size: 1.5rem; color: var(--cozy-green-dark); font-weight: 800;">Nilai Akhir: ${state.finalQuizScore * 10}</p>
                        </div>
                        <div style="display: flex; gap: 14px; margin-top: 10px;">
                            <button class="btn-secondary" onclick="sounds.playClick(); startFinalQuiz()">Ulangi Kuis Master 🔄</button>
                            <button class="btn-primary" onclick="sounds.playClick(); goToMenu()">Peta Utama 🗺️</button>
                        </div>
                    </div>
                `;
            }

            app.appendChild(container);
        }

        function createHUD() {
            const hud = document.createElement('div');
            hud.className = 'game-hud';
            const isPlaying = sounds.isBgmPlaying;
            hud.innerHTML = `
                <div class="hud-brand">
                    <span>🎒 Petualangan Hobi - Kelas V</span>
                </div>
                <div class="hud-stats">
                    <button class="${isPlaying ? 'btn-ui btn-bgm-on' : 'btn-ui'}" onclick="toggleBGMPlayer(this)">
                        ${isPlaying ? '🔊 BGM: ON' : '🔇 BGM: OFF'}
                    </button>
                    <div class="hud-badge">
                        <span>⭐ ${state.stars} Bintang</span>
                    </div>
                    <button class="btn-ui" onclick="sounds.playClick(); goToMenu()">
                        🗺️ Peta Misi
                    </button>
                </div>
            `;
            return hud;
        }

        function goToMenu() { state.currentScreen = 'menu'; render(); }
        function openMaterial(id) { state.currentMaterialId = id; state.currentScreen = 'material'; state.materialStep = 'explain'; state.selectedAnswer = null; state.isAnswered = false; render(); }
        function setMaterialStep(step) { state.materialStep = step; render(); }
        function startMiniGame() { 
            state.materialStep = 'game'; 
            state.currentQuestionIndex = 0; 
            state.gameFeedback = null; 
            state.stars = 0; 
            state.prosedurOrder = [2, 1, 3, 0]; 
            state.selectedAnswer = null;
            state.isAnswered = false;
            render(); 
        }

        function renderGameContent(mat) {
            if (mat.gameType === 'mcq') {
                const q = mat.questions[state.currentQuestionIndex];
                const feedbackHtml = state.gameFeedback ? `<div class="feedback-banner ${state.gameFeedback.correct ? 'feedback-success' : 'feedback-error'}">${state.gameFeedback.msg}</div>` : '';

                return `
                    <div class="game-arena" id="gameArenaBox">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 800; color: var(--cozy-green-dark);">
                            <span>Pertanyaan ${state.currentQuestionIndex + 1} dari ${mat.questions.length}</span>
                        </div>
                        <div class="question-box">${q.q}</div>
                        <div class="options-grid">
                            ${q.options.map((opt, idx) => {
                                let btnClass = "option-game-btn";
                                if (state.isAnswered) {
                                    if (idx === q.answer) btnClass += " correct";
                                    else if (idx === state.selectedAnswer) btnClass += " incorrect";
                                }
                                return `<button class="${btnClass}" ${state.isAnswered ? 'disabled' : ''} onclick="answerMCQ(${idx})">${String.fromCharCode(65 + idx)}.${opt}</button>`;
                            }).join('')}
                        </div>
                        ${feedbackHtml}
                    </div>
                    <div class="action-footer">
                        <button class="btn-secondary" onclick="sounds.playClick(); setMaterialStep('summary')">← Kembali ke Rangkuman</button>
                        ${state.isAnswered ? `<button class="btn-primary" onclick="sounds.playClick(); nextQuestion()">Lanjut Misi ➔</button>` : ''}
                    </div>
                `;
            } else if (mat.gameType === 'sort_prosedur') {
                const q = mat.questions[0];
                const feedbackHtml = state.gameFeedback ? `<div class="feedback-banner ${state.gameFeedback.correct ? 'feedback-success' : 'feedback-error'}">${state.gameFeedback.msg}</div>` : '';

                return `
                    <div class="game-arena" id="gameArenaBox">
                        <p style="margin-bottom: 16px; font-weight: 800; color: var(--cozy-green-dark); font-size: 1.1rem;">${q.instruction}</p>
                        <ul class="sortable-list">
                            ${state.prosedurOrder.map((stepIdx, idx) => `
                                <li class="sortable-item">
                                    <span>${idx + 1}.${q.steps[stepIdx]}</span>
                                    <div class="sort-btn-group">
                                        <button class="sort-action-btn" onclick="sounds.playClick(); moveProsedur(${idx}, -1)">⬆</button>
                                        <button class="sort-action-btn" onclick="sounds.playClick(); moveProsedur(${idx}, 1)">⬇</button>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                        <button class="btn-primary" onclick="checkProsedur()" style="width: 100%; padding: 14px; font-size: 1.1rem;">Periksa Susunan Langkah ✨</button>
                        ${feedbackHtml}
                    </div>
                    <div class="action-footer">
                        <button class="btn-secondary" onclick="sounds.playClick(); setMaterialStep('summary')">← Kembali ke Rangkuman</button>
                        ${state.gameFeedback && state.gameFeedback.correct ? `<button class="btn-primary" onclick="sounds.playVictory(); finishMaterialGame()">Selesaikan Misi ➔</button>` : ''}
                    </div>
                `;
            }
        }

        function triggerShake() {
            const arena = document.getElementById('gameArenaBox');
            if (arena) {
                arena.classList.add('shake-effect');
                setTimeout(() => arena.classList.remove('shake-effect'), 400);
            }
        }

        function answerMCQ(selectedIdx) {
            if (state.isAnswered) return;
            const mat = appData.materials.find(m => m.id === state.currentMaterialId);
            const q = mat.questions[state.currentQuestionIndex];
            
            state.selectedAnswer = selectedIdx;
            state.isAnswered = true;

            if (selectedIdx === q.answer) {
                sounds.playCorrect();
                state.stars += 1;
                state.gameFeedback = { correct: true, msg: "🎉 Hore! Jawabanmu benar! Kamu mendapat 1 Bintang ⭐" };
            } else {
                sounds.playWrong();
                triggerShake();
                state.gameFeedback = { correct: false, msg: `❌ Kurang tepat. ${q.hint}` };
            }
            render();
        }

        function nextQuestion() {
            const mat = appData.materials.find(m => m.id === state.currentMaterialId);
            state.currentQuestionIndex++;
            state.gameFeedback = null;
            state.selectedAnswer = null;
            state.isAnswered = false;
            if (state.currentQuestionIndex >= mat.questions.length) {
                state.materialStep = 'result';
                sounds.playVictory();
            }
            render();
        }

        function moveProsedur(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < state.prosedurOrder.length) {
                const temp = state.prosedurOrder[index];
                state.prosedurOrder[index] = state.prosedurOrder[newIndex];
                state.prosedurOrder[newIndex] = temp;
                render();
            }
        }

        function checkProsedur() {
            const correctTarget = [1, 0, 3, 2];
            const isCorrect = state.prosedurOrder.every((val, i) => val === correctTarget[i]);

            if (isCorrect) {
                sounds.playCorrect();
                state.stars = 1;
                state.gameFeedback = { correct: true, msg: "🎉 Luar biasa! Susunan langkah teks prosedur sudah sangat tepat!" };
            } else {
                sounds.playWrong();
                triggerShake();
                state.gameFeedback = { correct: false, msg: "❌ Susunan masih belum tepat. Ingat: panaskan dulu wajan, lalu pecahkan telur, beri garam, dan sajikan!" };
            }
            render();
        }

        function finishMaterialGame() { state.materialStep = 'result'; render(); }

        function startFinalQuiz() {
            state.currentScreen = 'final_quiz';
            state.finalQuizIndex = 0;
            state.finalQuizScore = 0;
            state.gameFeedback = null;
            state.selectedAnswer = null;
            state.isAnswered = false;
            render();
        }

        function renderFinalQuizContent() {
            const q = appData.finalQuiz[state.finalQuizIndex];
            const feedbackHtml = state.gameFeedback ? `<div class="feedback-banner ${state.gameFeedback.correct ? 'feedback-success' : 'feedback-error'}">${state.gameFeedback.msg}</div>` : '';

            return `
                <div class="quest-header">
                    <h2>👑 Kuis Master Petualangan</h2>
                    <span style="font-weight: 800; color: var(--cozy-green-dark);">Soal ${state.finalQuizIndex + 1} / ${appData.finalQuiz.length}</span>
                </div>
                <div class="game-arena" id="gameArenaBox">
                    <div class="question-box">${q.q}</div>
                    <div class="options-grid">
                        ${q.options.map((opt, idx) => {
                            let btnClass = "option-game-btn";
                            if (state.isAnswered) {
                                if (idx === q.answer) btnClass += " correct";
                                else if (idx === state.selectedAnswer) btnClass += " incorrect";
                            }
                            return `<button class="${btnClass}" ${state.isAnswered ? 'disabled' : ''} onclick="answerFinalQuiz(${idx})">${String.fromCharCode(65 + idx)}.${opt}</button>`;
                        }).join('')}
                    </div>
                    ${feedbackHtml}
                </div>
                <div class="action-footer">
                    <button class="btn-secondary" onclick="sounds.playClick(); goToMenu()">← Keluar</button>
                    ${state.isAnswered ? `<button class="btn-primary" onclick="sounds.playClick(); nextFinalQuizQuestion()">Lanjut Soal ➔</button>` : ''}
                </div>
            `;
        }

        function answerFinalQuiz(selectedIdx) {
            if (state.isAnswered) return;
            const q = appData.finalQuiz[state.finalQuizIndex];
            
            state.selectedAnswer = selectedIdx;
            state.isAnswered = true;

            if (selectedIdx === q.answer) {
                sounds.playCorrect();
                state.finalQuizScore++;
                state.gameFeedback = { correct: true, msg: "🎉 Benar! Pertahankan semangatmu!" };
            } else {
                sounds.playWrong();
                triggerShake();
                state.gameFeedback = { correct: false, msg: "❌ Kurang tepat. Perhatikan kunci jawaban di atas." };
            }
            render();
        }

        function nextFinalQuizQuestion() {
            state.finalQuizIndex++;
            state.gameFeedback = null;
            state.selectedAnswer = null;
            state.isAnswered = false;
            if (state.finalQuizIndex >= appData.finalQuiz.length) {
                state.currentScreen = 'quiz_result';
                sounds.playWinFanfare();
            }
            render();
        }

        window.onload = function() { render(); };
    </script>
</body>
</html>
